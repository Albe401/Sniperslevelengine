[workspace]
members = ["crates/snipers-core", "crates/massive-feed", "crates/snipers-store", "apps/desktop/src-tauri"]
default-members = ["crates/snipers-core", "crates/massive-feed", "crates/snipers-store"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "sync", "process", "io-util"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
